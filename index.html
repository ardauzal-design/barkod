<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saha Barkod Okutma</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        .search-box { width: 100%; padding: 16px; font-size: 22px; font-weight: bold; text-align: center; border: 2px solid #007bff; border-radius: 12px; outline: none; margin-bottom: 15px; }
        .status { text-align: center; font-size: 14px; color: #007bff; font-weight: bold; margin-bottom: 10px; }
        .product-card { background: white; padding: 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e0e0e0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .product-card:active { background-color: #e7f1ff; border-color: #007bff; }
        .product-name { font-weight: 600; font-size: 15px; color: #333; }
        .product-sku { font-size: 12px; color: #666; margin-top: 4px; }
        .select-badge { background: #007bff; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        #barcode-display { display: none; background: white; padding: 20px 10px; border-radius: 12px; text-align: center; margin-top: 10px; }
        .active-title { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 10px; }
        svg { max-width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="container">
    <div id="status" class="status">🔄 Google Sheets Verisi Çekiliyor...</div>
    <input type="number" id="searchInput" class="search-box" placeholder="Son 5 Haneyi Girin" autofocus oninput="onSearch()" disabled>
    
    <div id="productList"></div>

    <div id="barcode-display">
        <div id="selectedProductName" class="active-title"></div>
        <svg id="barcode"></svg>
    </div>
</div>

<script>
    // GOOGLE SHEETS ID'NİZİ BURAYA YAPIŞTIRIN:
    const sheetId = "BURAYA_GOOGLE_SHEETS_IDNIZI_YAZIN";
    const apiUrl = `https://opensheet.elk.sh/${sheetId}/1`;

    let db = [];

    // Sayfa her açıldığında Google Sheets'teki en güncel veriyi çeker
    fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            db = data;
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = `✅ ${db.length} Ürün Canlı Yüklendi!`;
            statusDiv.style.color = "#28a745";
            document.getElementById("searchInput").disabled = false;
        })
        .catch(err => {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "❌ Veri çekilemedi. Google Sheets izinlerini kontrol edin.";
            statusDiv.style.color = "#dc3545";
        });

    function onSearch() {
        const query = document.getElementById("searchInput").value.trim();
        const listDiv = document.getElementById("productList");
        const barcodeDisplay = document.getElementById("barcode-display");

        listDiv.innerHTML = "";
        barcodeDisplay.style.display = "none";

        if (query.length < 3) return;

        let matches = [];

        db.forEach(item => {
            if (!item.barcodes) return;

            // Virgülle ayrılmış çoklu barkodları kontrol etme
            const barcodeList = String(item.barcodes).split(',').map(b => b.trim());

            barcodeList.forEach(singleBarcode => {
                if (singleBarcode.endsWith(query)) {
                    matches.push({
                        sku_id: item.sku_id || '',
                        product_name: item.product_name || 'İsimsiz Ürün',
                        activeBarcode: singleBarcode
                    });
                }
            });
        });

        if (matches.length === 1) {
            renderBarcode(matches[0]);
        } else if (matches.length > 1) {
            matches.forEach(item => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.onclick = () => renderBarcode(item);
                card.innerHTML = `
                    <div>
                        <div class="product-name">${item.product_name}</div>
                        <div class="product-sku">SKU: ${item.sku_id} | Barkod: ${item.activeBarcode}</div>
                    </div>
                    <div class="select-badge">SEÇ</div>
                `;
                listDiv.appendChild(card);
            });
        }
    }

    function renderBarcode(item) {
        document.getElementById("productList").innerHTML = "";
        document.getElementById("selectedProductName").innerText = item.product_name;
        document.getElementById("barcode-display").style.display = "block";

        JsBarcode("#barcode", item.activeBarcode, {
            format: "CODE39",
            width: 2.2,
            height: 110,
            displayValue: true,
            fontOptions: "bold"
        });
    }
</script>

</body>
</html>
