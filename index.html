<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Saha Barkod Sistemi - Yemeksepeti Partner</title>
    <!-- JsBarcode & PapaParse & HTML5-QRCode Kütüphaneleri -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --ys-primary: #ea004b;
            --ys-primary-hover: #c90040;
            --ys-bg: #f8fafc;
            --ys-card: #ffffff;
            --ys-text: #0f172a;
            --ys-muted: #64748b;
            --ys-border: #e2e8f0;
        }

        body.dark-mode {
            --ys-bg: #0f172a;
            --ys-card: #1e293b;
            --ys-text: #f8fafc;
            --ys-muted: #94a3b8;
            --ys-border: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ys-bg);
            color: var(--ys-text);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.2s;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Header / Logo */
        .app-header {
            background: var(--ys-card);
            border: 1px solid var(--ys-border);
            padding: 16px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
        }

        .brand-logo {
            height: 32px;
            object-fit: contain;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-theme {
            background: var(--ys-bg);
            border: 1px solid var(--ys-border);
            color: var(--ys-text);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        /* Durum Rozeti */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #f1f5f9;
            color: var(--ys-muted);
        }
        .status-badge.success { background: #dcfce7; color: #15803d; }
        .status-badge.error { background: #fee2e2; color: #b91c1c; }

        /* Arama & Kamera Kartı */
        .search-card {
            background: var(--ys-card);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--ys-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input-group {
            display: flex;
            gap: 8px;
        }

        .search-box {
            flex: 1;
            padding: 14px;
            font-size: 18px;
            font-weight: 700;
            border: 2px solid var(--ys-border);
            border-radius: 12px;
            outline: none;
            background: var(--ys-bg);
            color: var(--ys-text);
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: var(--ys-primary);
        }

        .btn-cam {
            background: var(--ys-primary);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cam:hover { background: var(--ys-primary-hover); }

        /* Kamera Alanı */
        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            border: 2px solid var(--ys-primary);
        }

        /* Ürün Liste Kartları */
        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card {
            background: var(--ys-card);
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--ys-border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .product-card:hover {
            border-color: var(--ys-primary);
            background: var(--ys-bg);
        }

        .product-name { font-weight: 700; font-size: 15px; color: var(--ys-text); }
        .product-sku { font-size: 12px; color: var(--ys-muted); margin-top: 4px; }

        .btn-select {
            background: var(--ys-primary);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
        }

        /* Barkod Gösterim Ekrana */
        #barcode-display {
            display: none;
            background: var(--ys-card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--ys-border);
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
        }

        .active-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--ys-text);
            margin-bottom: 14px;
        }

        .barcode-box {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            border: 1px dashed var(--ys-border);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg { max-width: 100%; height: auto; }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--ys-border);
            background: var(--ys-bg);
            color: var(--ys-text);
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .btn-action:hover { background: var(--ys-border); }
        .btn-action.primary { background: var(--ys-primary); color: white; border: none; }
        .btn-action.primary:hover { background: var(--ys-primary-hover); }

        @media print {
            body * { visibility: hidden; }
            #barcode-display, #barcode-display * { visibility: visible; }
            #barcode-display { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; }
            .action-btns { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header / Logo -->
    <div class="app-header">
        <img class="brand-logo" src="https://lh3.googleusercontent.com/2pv3nFogNN8hnYzMA4QeKE-Rj8mC7YlQPJOxuYJy-EwrVUHuqG-CuF5KaPz0seyugb1EVGmGEEe0JHucp0dDGgVyEvk=s60" alt="Yemeksepeti Partner">
        <div class="header-actions">
            <button class="btn-theme" onclick="toggleTheme()">🌙 / ☀️</button>
        </div>
    </div>

    <!-- Durum Rozeti -->
    <div style="text-align: center;">
        <span id="status" class="status-badge">🔄 Canlı Veri Çekiliyor...</span>
    </div>

    <!-- Arama Kutusu & Kamera Butonu -->
    <div class="search-card">
        <div class="search-input-group">
            <input type="text" id="searchInput" class="search-box" placeholder="Son 5 Hane veya Ürün Adı..." autofocus oninput="onSearch()" disabled>
            <button class="btn-cam" onclick="toggleCamera()" title="Kamera ile Tara">📷</button>
        </div>
        <div id="reader"></div>
    </div>

    <!-- Ürün Arama Sonuçları -->
    <div id="productList" class="product-list"></div>

    <!-- Barkod Gösterim Kartı -->
    <div id="barcode-display">
        <div id="selectedProductName" class="active-title"></div>
        <div class="barcode-box">
            <svg id="barcode"></svg>
        </div>
        
        <div class="action-btns">
            <button class="btn-action" onclick="copyBarcode()">📋 Kopyala</button>
            <button class="btn-action" onclick="window.print()">🖨️ Yazdır</button>
            <button class="btn-action primary" onclick="resetSearch()">🔍 Yeni Arama</button>
        </div>
    </div>
</div>

<script>
    const sheetCsvUrl = "https://docs.google.com/spreadsheets/d/1OnCqXlcTSyeI4dzxOFq1JrS4SHKxIY6eHGvcz-VWZWA/export?format=csv";

    let db = [];
    let html5QrcodeScanner = null;
    let currentBarcodeValue = "";

    // WebAudio Bip Sesi
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.15);
        } catch (e) {}

        if (navigator.vibrate) {
            navigator.vibrate(100);
        }
    }

    // Google Sheets Canlı CSV Çekme
    fetch(sheetCsvUrl)
        .then(res => res.text())
        .then(csvText => {
            const results = Papa.parse(csvText, { skipEmptyLines: true });
            const rows = results.data;
            db = [];

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (row && row.length >= 3) {
                    const barcodeVal = row[2] ? row[2].trim() : (row[4] ? row[4].trim() : '');
                    if (barcodeVal) {
                        db.push({
                            sku_id: row[0] ? row[0].trim() : '',
                            product_name: row[1] ? row[1].trim() : 'İsimsiz Ürün',
                            barcodes: barcodeVal
                        });
                    }
                }
            }

            const statusDiv = document.getElementById("status");
            statusDiv.innerText = `✅ ${db.length} Ürün Canlı Yüklendi`;
            statusDiv.className = "status-badge success";
            document.getElementById("searchInput").disabled = false;
        })
        .catch(err => {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "❌ Veri Çekilemedi";
            statusDiv.className = "status-badge error";
        });

    // Arama Fonksiyonu (Hem Son 5 Hane Hem İsim İle)
    function onSearch() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();
        const listDiv = document.getElementById("productList");
        const barcodeDisplay = document.getElementById("barcode-display");

        listDiv.innerHTML = "";
        barcodeDisplay.style.display = "none";

        if (query.length < 2) return;

        let matches = [];

        db.forEach(item => {
            if (!item.barcodes) return;

            const barcodeList = String(item.barcodes).split(',').map(b => b.trim());

            barcodeList.forEach(singleBarcode => {
                const matchesBarcode = singleBarcode.toLowerCase().endsWith(query);
                const matchesName = item.product_name.toLowerCase().includes(query);

                if (matchesBarcode || matchesName) {
                    matches.push({
                        sku_id: item.sku_id,
                        product_name: item.product_name,
                        activeBarcode: singleBarcode
                    });
                }
            });
        });

        if (matches.length === 1) {
            renderBarcode(matches[0]);
        } else if (matches.length > 1) {
            // İlk 20 sonucu göster (performans için)
            matches.slice(0, 20).forEach(item => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.onclick = () => renderBarcode(item);
                card.innerHTML = `
                    <div>
                        <div class="product-name">${item.product_name}</div>
                        <div class="product-sku">SKU: ${item.sku_id} | Barkod: ${item.activeBarcode}</div>
                    </div>
                    <div class="btn-select">SEÇ</div>
                `;
                listDiv.appendChild(card);
            });
        }
    }

    // Barkod Çizme (Terminalin algılaması için başa/sona * eklenir)
    function renderBarcode(item) {
        playBeep();
        document.getElementById("productList").innerHTML = "";
        document.getElementById("selectedProductName").innerText = item.product_name;
        document.getElementById("barcode-display").style.display = "block";

        currentBarcodeValue = item.activeBarcode;

        // El terminalinin okuması için fiziki baş/son * karakteri eklemesi yapılır
        const formattedBarcode = `*${item.activeBarcode}*`;

        JsBarcode("#barcode", formattedBarcode, {
            format: "CODE39",
            width: 2.2,
            height: 110,
            displayValue: true,
            fontOptions: "bold"
        });

        // Kamera açıksa kapat
        if (html5QrcodeScanner) {
            stopCamera();
        }
    }

    // Kamera Tarama Toggle
    function toggleCamera() {
        const readerDiv = document.getElementById("reader");
        if (readerDiv.style.display === "block") {
            stopCamera();
        } else {
            readerDiv.style.display = "block";
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                (decodedText) => {
                    document.getElementById("searchInput").value = decodedText;
                    onSearch();
                    stopCamera();
                },
                () => {}
            );
        }
    }

    function stopCamera() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => {
                document.getElementById("reader").style.display = "none";
                html5QrcodeScanner = null;
            }).catch(() => {
                document.getElementById("reader").style.display = "none";
            });
        }
    }

    // Barkod Kopyalama
    function copyBarcode() {
        if (!currentBarcodeValue) return;
        navigator.clipboard.writeText(currentBarcodeValue).then(() => {
            alert("Barkod kopyalandı: " + currentBarcodeValue);
        });
    }

    // Temizleme / Reset
    function resetSearch() {
        const input = document.getElementById("searchInput");
        input.value = "";
        document.getElementById("productList").innerHTML = "";
        document.getElementById("barcode-display").style.display = "none";
        input.focus();
    }

    // Gece Modu Toggle
    function toggleTheme() {
        document.body.classList.toggle("dark-mode");
    }
</script>

</body>
</html>
